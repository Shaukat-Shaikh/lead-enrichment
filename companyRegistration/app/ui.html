<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Registration Widget</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        margin: 0;
        background-color: #f9f9f9;
      }
      .form-container {
        max-width: 500px;
        margin: 0 auto;
        background: #ffffff;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h2 {
        margin-top: 0;
        font-size: 1.25rem;
        color: #333;
      }
      .form-group {
        margin-bottom: 16px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #555;
        font-size: 0.9rem;
      }
      input[type="text"],
      input[type="email"],
      input[type="tel"],
      select,
      textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 0.95rem;
      }
      textarea {
        resize: vertical;
        height: 80px;
      }
      .hint {
        font-size: 0.8rem;
        color: #888;
        margin-top: 4px;
      }
      button {
        width: 100%;
        padding: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled {
        background-color: #9bbbe0;
        cursor: not-allowed;
      }
      button:hover:not(:disabled) {
        background-color: #0056b3;
      }
      .success-message {
        display: none;
        padding: 12px;
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
        border-radius: 4px;
        text-align: center;
        margin-top: 16px;
        font-weight: bold;
      }
      .error-message {
        display: none;
        padding: 12px;
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        border-radius: 4px;
        margin-top: 16px;
        font-size: 0.85rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .status-message {
        display: none;
        padding: 8px 12px;
        background-color: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
        border-radius: 4px;
        margin-top: 12px;
        font-size: 0.85rem;
      }
      .license-key {
        margin-top: 10px;
        font-size: 0.95rem;
        word-break: break-all;
        color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h2>Company Registration</h2>

      <form id="widgetForm" onsubmit="return false;">
        <div class="form-group">
          <label for="companyName">Company Name *</label>
          <input type="text" id="companyName" name="companyName" required />
        </div>

        <div class="form-group">
          <label for="contactName">Contact Name *</label>
          <input type="text" id="contactName" name="contactName" required />
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="+1-555-0100" />
        </div>

        <div class="form-group">
          <label for="aboutCompany">About Company *</label>
          <textarea
            id="aboutCompany"
            name="aboutCompany"
            required
            placeholder="Brief description of what the company does"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="industry">Industry *</label>
          <input
            type="text"
            id="industry"
            name="industry"
            required
            placeholder="e.g. Cloud Services, Healthcare, Finance"
          />
        </div>

        <div class="form-group">
          <label for="productsServiceLines">Products / Service Lines *</label>
          <input
            type="text"
            id="productsServiceLines"
            name="productsServiceLines"
            required
            placeholder="e.g. Azure Migration, Managed Services, Power BI"
          />
          <div class="hint">Separate multiple items with commas</div>
        </div>

        <div class="form-group">
          <label for="language">Language</label>
          <select id="language" name="language">
            <option value="English" selected>English</option>
            <option value="Spanish">Spanish</option>
            <option value="French">French</option>
            <option value="German">German</option>
            <option value="Hindi">Hindi</option>
            <option value="Arabic">Arabic</option>
            <option value="Chinese">Chinese</option>
            <option value="Japanese">Japanese</option>
            <option value="Portuguese">Portuguese</option>
          </select>
        </div>

        <button type="submit" id="submitBtn">Register</button>
      </form>

      <div id="statusMessage" class="status-message"></div>
      <div id="errorMessage" class="error-message"></div>

      <div id="successMessage" class="success-message">
        Registration successful!
        <div class="license-key" id="licenseKey"></div>
      </div>
    </div>

    <script src="https://live.zwidgets.com/js-sdk/1.0.5/ZohoEmbededAppSDK.min.js"></script>
    <script>
      "use strict";

      // ---------------------------------------------------------------
      // CONFIG
      // ---------------------------------------------------------------
      const CRM_ENTITY = "intelegence__name_of_lead";
      const FIELD_LICENSE_KEY = "intelegence__enrichment_lisense";
      const REGISTER_API_URL =
        "https://ef99-49-248-125-98.ngrok-free.app/api/v1/register";
      const ZOHO_INIT_TIMEOUT_MS = 10000;

      // ---------------------------------------------------------------
      // UI helpers
      // ---------------------------------------------------------------
      const submitBtn = document.getElementById("submitBtn");
      const errorBox = document.getElementById("errorMessage");
      const statusBox = document.getElementById("statusMessage");
      const successBox = document.getElementById("successMessage");
      const widgetForm = document.getElementById("widgetForm");

      function showError(msg) {
        console.error(msg);
        errorBox.textContent = msg;
        errorBox.style.display = "block";
        statusBox.style.display = "none";
      }

      function clearMessages() {
        errorBox.style.display = "none";
        errorBox.textContent = "";
        statusBox.style.display = "none";
        statusBox.textContent = "";
      }

      function showStatus(msg) {
        statusBox.textContent = msg;
        statusBox.style.display = "block";
      }

      window.addEventListener("error", function (e) {
        showError("Unexpected script error: " + (e.message || e));
      });
      window.addEventListener("unhandledrejection", function (e) {
        showError(
          "Unhandled promise rejection: " +
            (e.reason && e.reason.message ? e.reason.message : e.reason),
        );
      });

      // ---------------------------------------------------------------
      // Zoho SDK initialization
      // ---------------------------------------------------------------
      let zohoReadyResolve;
      const zohoReady = new Promise((resolve) => {
        zohoReadyResolve = resolve;
      });

      if (typeof ZOHO === "undefined") {
        showError(
          "The Zoho embedded SDK script failed to load (ZOHO is undefined). " +
            "Check the Network tab for a failed/blocked request to " +
            "https://live.zwidgets.com/js-sdk/1.0.5/ZohoEmbededAppSDK.min.js -- " +
            "this widget cannot function without it.",
        );
        zohoReadyResolve(false);
      } else {
        ZOHO.embeddedApp.on("PageLoad", function (data) {
          console.log("PageLoad event data:", data);
        });

        ZOHO.embeddedApp
          .init()
          .then(function () {
            console.log("ZOHO.embeddedApp.init() succeeded.");
            zohoReadyResolve(true);
          })
          .catch(function (initErr) {
            showError(
              "ZOHO.embeddedApp.init() failed: " + JSON.stringify(initErr),
            );
            zohoReadyResolve(false);
          });
      }

      // ---------------------------------------------------------------
      // Form submission
      // ---------------------------------------------------------------
      widgetForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        clearMessages();
        submitBtn.disabled = true;
        submitBtn.textContent = "Registering...";

        try {
          showStatus("Waiting for Zoho CRM connection...");
          const zohoOk = await Promise.race([
            zohoReady,
            new Promise((resolve) =>
              setTimeout(() => resolve("timeout"), ZOHO_INIT_TIMEOUT_MS),
            ),
          ]);

          if (zohoOk === "timeout") {
            throw new Error(
              `Timed out after ${ZOHO_INIT_TIMEOUT_MS / 1000}s waiting for ZOHO.embeddedApp.init(). ` +
                "This widget may not be running inside the expected Zoho CRM context/iframe.",
            );
          }
          if (zohoOk !== true) {
            throw new Error(
              "Zoho SDK did not initialize successfully (see earlier error above).",
            );
          }

          // ---- Fetch Organization ID from Zoho ----
          showStatus("Fetching organization info...");
          let orgId = "";
          try {
            const orgInfo = await ZOHO.CRM.CONFIG.getOrgInfo();
            console.log("Org info:", JSON.stringify(orgInfo, null, 2));
            orgId =
              (orgInfo && orgInfo.org && orgInfo.org[0] && orgInfo.org[0].id) ||
              "";
          } catch (orgErr) {
            console.warn("Could not fetch org ID:", orgErr);
          }

          if (!orgId) {
            throw new Error(
              "Could not retrieve the Zoho Organization ID. " +
                "Make sure the widget has the required scopes.",
            );
          }

          // ---- Build payload matching the API contract ----
          const productsRaw = document.getElementById(
            "productsServiceLines",
          ).value;
          const productsArray = productsRaw
            .split(",")
            .map((s) => s.trim())
            .filter((s) => s.length > 0);

          const payload = {
            orgId: orgId,
            companyName: document.getElementById("companyName").value,
            contactName: document.getElementById("contactName").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            aboutCompany: document.getElementById("aboutCompany").value,
            industry: document.getElementById("industry").value,
            productsServiceLines: productsArray,
            language: document.getElementById("language").value,
          };

          console.log(
            "Registration payload:",
            JSON.stringify(payload, null, 2),
          );

          // ---- Step 1: Call registration API to get the license key ----
          showStatus("Registering with API...");
          let res;
          try {
            res = await fetch(REGISTER_API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
          } catch (fetchErr) {
            throw new Error(
              `Could not reach the registration API at ${REGISTER_API_URL}. ` +
                "Please check that the API server is running and the ngrok tunnel is active. " +
                "Original error: " +
                fetchErr.message,
            );
          }

          if (!res.ok) {
            const bodyText = await res.text().catch(() => "");
            throw new Error(
              `Registration API returned HTTP ${res.status} ${res.statusText}. Body: ${bodyText}`,
            );
          }

          const data = await res.json();
          const licenseKey = data.licenseKey;

          if (!licenseKey) {
            throw new Error(
              "Registration API responded but no 'licenseKey' field was found in the JSON: " +
                JSON.stringify(data),
            );
          }

          console.log("License key from API:", licenseKey);

          // ---- Step 2: upsert record in Zoho CRM custom module ----
          showStatus("Checking for existing record...");

          let existingId = null;

          try {
            const allRes = await ZOHO.CRM.API.getAllRecords({
              Entity: CRM_ENTITY,
              page: 1,
              per_page: 1,
            });

            console.log(
              "getAllRecords response:",
              JSON.stringify(allRes, null, 2),
            );

            if (allRes && allRes.data && allRes.data.length > 0) {
              existingId = allRes.data[0].id;
              console.log("Found existing record ID:", existingId);
            }
          } catch (fetchErr) {
            console.log("No existing records in module (empty):", fetchErr);
          }

          const apiData = {
            Name: payload.companyName,
            [FIELD_LICENSE_KEY]: licenseKey,
          };

          let response;

          if (existingId) {
            // ---- UPDATE existing record ----
            showStatus("Updating existing record in Zoho CRM...");
            apiData.id = existingId;
            console.log(
              "Updating record",
              existingId,
              "in module:",
              CRM_ENTITY,
              "with data:",
              apiData,
            );

            response = await ZOHO.CRM.API.updateRecord({
              Entity: CRM_ENTITY,
              APIData: apiData,
              RecordID: existingId,
            });
          } else {
            // ---- INSERT new record ----
            showStatus("Creating new record in Zoho CRM...");
            console.log(
              "Inserting into module:",
              CRM_ENTITY,
              "with data:",
              apiData,
            );

            response = await ZOHO.CRM.API.insertRecord({
              Entity: CRM_ENTITY,
              APIData: apiData,
            });
          }

          console.log("Zoho CRM response:", JSON.stringify(response, null, 2));

          const record = response && response.data && response.data[0];

          if (record && record.code === "SUCCESS") {
            document.getElementById("licenseKey").textContent =
              "License Key: " + licenseKey;
            widgetForm.style.display = "none";
            clearMessages();
            successBox.style.display = "block";
          } else {
            const code = record && record.code;
            const message = record && record.message;
            const details = record && JSON.stringify(record.details);
            const action = existingId ? "updateRecord" : "insertRecord";
            throw new Error(
              `Zoho ${action} failed.\nCode: ${code}\nMessage: ${message}\nDetails: ${details}\n\n` +
                "Common causes:\n" +
                `- "${CRM_ENTITY}" is not the exact API name of your module\n` +
                `- "${FIELD_LICENSE_KEY}" is not the exact API name of the license field\n` +
                "- A required field on the module is missing from APIData\n" +
                "- The widget's scope doesn't allow creating/updating records in this module",
            );
          }
        } catch (err) {
          showError(
            "Error: " +
              (err && err.message ? err.message : JSON.stringify(err)),
          );
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Register";
        }
      });
    </script>
  </body>
</html>
